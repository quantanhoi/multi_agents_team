services:
  backend:
    build: ./backend
    container_name: multi-agent-backend
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - ${PROJECT_DIR:-./projects}:/workspace
    environment:
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://host.docker.internal:11435}
      - OLLAMA_API=${OLLAMA_API:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-Multi-Agent Bot}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-agent@multi-agent-studio.ai}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: multi-agent-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
